name: Build IPO Sentinel v1.3.3

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "backend/**"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/ipo-sentinel-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Public repository secret-hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.private-signing/|\.(jks|keystore|p12|pfx)$|(^|/)(id_rsa|id_ed25519)$|(^|/)secrets\.properties$|(^|/)\.env$'; then
            echo "Sensitive key/signing/secret material is tracked. Refusing build."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + tests
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile backend
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m compileall -q app scripts tests

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -q

      - name: Dependency check
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pip check

  build-apk:
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Architecture and security gates
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_FILES=(
            app/src/main/java/com/suhas/iposentinel/MainActivity.kt
            app/src/main/java/com/suhas/iposentinel/AppStateRepository.kt
            app/src/main/java/com/suhas/iposentinel/AppAudit.kt
            app/src/main/java/com/suhas/iposentinel/RecoveryTriggers.kt
            app/src/main/java/com/suhas/iposentinel/BrokerRecovery.kt
            app/src/main/java/com/suhas/iposentinel/CallLedger.kt
          )

          grep -n 'versionCode = 133' app/build.gradle.kts
          grep -n 'versionName = "1.3.3"' app/build.gradle.kts
          grep -n 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -n 'BIND_NOTIFICATION_LISTENER_SERVICE' app/src/main/AndroidManifest.xml
          grep -n 'RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          grep -n 'class AppStateRepository' app/src/main/java/com/suhas/iposentinel/AppStateRepository.kt
          grep -n 'class CallLedgerStore' app/src/main/java/com/suhas/iposentinel/CallLedger.kt
          grep -n 'recommendedAt' app/src/main/java/com/suhas/iposentinel/CallLedger.kt
          grep -n 'class BrokerNotificationListenerService' app/src/main/java/com/suhas/iposentinel/RecoveryTriggers.kt
          grep -n 'class RecoveryBootReceiver' app/src/main/java/com/suhas/iposentinel/RecoveryTriggers.kt
          grep -n 'PeriodicWorkRequestBuilder<BrokerRecoveryWorker>' app/src/main/java/com/suhas/iposentinel/RecoveryTriggers.kt
          grep -n '/v1/order/list' app/src/main/java/com/suhas/iposentinel/BrokerRecovery.kt
          grep -n '/v1/positions/user' app/src/main/java/com/suhas/iposentinel/BrokerRecovery.kt
          grep -n 'https://api.groww.in' app/src/main/java/com/suhas/iposentinel/DirectGrowwClient.kt
          grep -n 'https://www.nseindia.com' app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt
          grep -n 'growwapi-assets.groww.in/instruments/instrument.csv' app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt
          grep -n '"DISCOVERED"' app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt
          grep -n '"IDENTITY_VERIFIED"' app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt
          grep -n '"GROWW_SYMBOL_VERIFIED"' app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt
          grep -n '"READY_FOR_RESEARCH"' app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt
          grep -n 'liveExecutionReady = false' app/src/main/java/com/suhas/iposentinel/DirectGrowwClient.kt

          if grep -n -E 'BackendApi\(|fetchResearchPlan\(|fetchResearchDashboard\(|fetchStrategySummary\(|fetchOrderEvents\(' "${ACTIVE_FILES[@]}"; then
            echo "Active Android architecture calls the disabled legacy BackendApi path."
            exit 1
          fi

          if grep -n -E 'IPO_SENTINEL_API_URL|IPO_SENTINEL_DEVICE_KEY|X-IPO-Sentinel-Device-Key|Trading Service|trading-service endpoint|device key|backend URL' "${ACTIVE_FILES[@]}"; then
            echo "Legacy user-entered service configuration leaked into active Android UI/state."
            exit 1
          fi

          if grep -n -E 'http://' "${ACTIVE_FILES[@]}" app/src/main/java/com/suhas/iposentinel/DirectGrowwClient.kt app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt; then
            echo "Cleartext URL found in active Android networking."
            exit 1
          fi

          if grep -n -E 'fetchOrderEvents\(|startForeground\(' app/src/main/java/com/suhas/iposentinel/RecoveryTriggers.kt app/src/main/java/com/suhas/iposentinel/BrokerRecovery.kt; then
            echo "Recovery must not depend on legacy foreground polling."
            exit 1
          fi

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile Android
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare verified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/IPO-Sentinel-v1.3.3-RECOVERY-debug.apk
          test -s release/IPO-Sentinel-v1.3.3-RECOVERY-debug.apk
          sha256sum release/IPO-Sentinel-v1.3.3-RECOVERY-debug.apk > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPO-Sentinel-v1.3.3-RECOVERY
          path: |
            android/release/IPO-Sentinel-v1.3.3-RECOVERY-debug.apk
            android/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
