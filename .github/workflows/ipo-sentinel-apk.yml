name: Build IPO Sentinel Stable

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "backend/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/ipo-sentinel-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Public repository secret-hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.private-signing/|\.(jks|keystore|p12|pfx)$|(^|/)(id_rsa|id_ed25519)$'; then
            echo "Sensitive signing/key material is tracked. Refusing public release."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + tests
        id: install
        shell: bash
        run: |
          set -o pipefail
          cd backend
          python -m pip install --upgrade pip 2>&1 | tee ../ipo-backend-validation.log
          python -m pip install -e ".[dev]" 2>&1 | tee -a ../ipo-backend-validation.log

      - name: Compile backend
        id: compile
        shell: bash
        run: |
          set -o pipefail
          cd backend
          python -m compileall -q app scripts tests 2>&1 | tee -a ../ipo-backend-validation.log

      - name: Run backend tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cd backend
          python -m pytest -q 2>&1 | tee -a ../ipo-backend-validation.log

      - name: Dependency check
        id: deps
        shell: bash
        run: |
          set -o pipefail
          cd backend
          python -m pip check 2>&1 | tee -a ../ipo-backend-validation.log

      - name: Upload backend validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-sentinel-backend-validation
          path: ipo-backend-validation.log
          if-no-files-found: error
          retention-days: 7

  build-apk:
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IPO_SENTINEL_API_URL: ${{ secrets.IPO_SENTINEL_API_URL }}
      IPO_SENTINEL_DEVICE_KEY: ${{ secrets.IPO_SENTINEL_DEVICE_KEY }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build stable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/IPO-Sentinel-v1.2.0-FINAL-debug.apk
          sha256sum release/IPO-Sentinel-v1.2.0-FINAL-debug.apk > release/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPO-Sentinel-v1.2.0-FINAL
          path: android/release/*
          if-no-files-found: error
          retention-days: 30
