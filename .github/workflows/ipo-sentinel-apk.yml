name: Build IPO Sentinel v1.4.4

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "backend/**"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/ipo-sentinel-apk.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Public repository secret-hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.private-signing/|\.(jks|keystore|p12|pfx)$|(^|/)(id_rsa|id_ed25519)$|(^|/)secrets\.properties$|(^|/)\.env$'; then
            echo "Sensitive key/signing/secret material is tracked. Refusing build."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + tests
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile backend
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m compileall -q app scripts tests

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -q

      - name: Dependency check
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pip check

  build-apk:
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Architecture and strategy gates
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_FILES=(
            app/src/main/java/com/suhas/iposentinel/MainActivity.kt
            app/src/main/java/com/suhas/iposentinel/AppStateRepository.kt
            app/src/main/java/com/suhas/iposentinel/AppAudit.kt
            app/src/main/java/com/suhas/iposentinel/CallLedger.kt
            app/src/main/java/com/suhas/iposentinel/DirectMarketDataClient.kt
            app/src/main/java/com/suhas/iposentinel/AdaptiveStrategyEngine.kt
            app/src/main/java/com/suhas/iposentinel/SignalLearning.kt
            app/src/main/java/com/suhas/iposentinel/ResearchLearningScheduler.kt
            app/src/main/java/com/suhas/iposentinel/RecoveryTriggers.kt
            app/src/main/java/com/suhas/iposentinel/BrokerRecovery.kt
            app/src/main/java/com/suhas/iposentinel/TradeReview.kt
          )

          grep -n 'versionCode = 144' app/build.gradle.kts
          grep -n 'versionName = "1.4.4"' app/build.gradle.kts
          grep -n 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -n 'AppScreen.CALLS' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'CallsMode.LIVE' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'Research candidates never appear here' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'private fun CallsModeSegment' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'Groww " + call.growwSymbol' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'Identity pending' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'definition.ingredients.joinToString' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'SHADOW P&L' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'CLOSED P&L' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'ACCOUNT_CAPITAL_RUPEES = 100_000.0' app/src/main/java/com/suhas/iposentinel/AdaptiveStrategyEngine.kt
          grep -n 'relative_strength_continuation.*20' app/src/test/java/com/suhas/iposentinel/AdaptiveStrategyEngineTest.kt || grep -n 'assertEquals(20, ShadowExecutionPolicy.holdFor("relative_strength_continuation")' app/src/test/java/com/suhas/iposentinel/AdaptiveStrategyEngineTest.kt
          grep -n 'shadow_pnl_rupees' app/src/main/java/com/suhas/iposentinel/CallLedger.kt
          grep -n 'realised_pnl' app/src/main/java/com/suhas/iposentinel/BrokerRecovery.kt
          grep -n '/v1/margins/detail/user' app/src/main/java/com/suhas/iposentinel/TradeReview.kt
          grep -n '/v1/user/detail' app/src/main/java/com/suhas/iposentinel/TradeReview.kt
          grep -n 'Groww live-trading readiness' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'DDPI enabled' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n '/v1/margins/detail/orders?segment=CASH' app/src/main/java/com/suhas/iposentinel/TradeReview.kt
          grep -n 'MANUAL BROKER CONFIRMATION' app/src/main/java/com/suhas/iposentinel/MainActivity.kt
          grep -n 'MIN_BUDGET_RUPEES = 1_000' app/src/main/java/com/suhas/iposentinel/TradeReview.kt
          grep -n 'MAX_BUDGET_RUPEES = 100_000' app/src/main/java/com/suhas/iposentinel/TradeReview.kt
          grep -n '/v1/historical/candles' app/src/main/java/com/suhas/iposentinel/DirectMarketDataClient.kt
          grep -n 'class CandleArchiveStore' app/src/main/java/com/suhas/iposentinel/DirectMarketDataClient.kt
          grep -n 'class ShadowReplayEngine' app/src/main/java/com/suhas/iposentinel/SignalLearning.kt
          grep -n 'class MarketSignalWorker' app/src/main/java/com/suhas/iposentinel/ResearchLearningScheduler.kt
          grep -n 'class PreMarketResearchWorker' app/src/main/java/com/suhas/iposentinel/ResearchLearningScheduler.kt
          grep -n 'delayToMinutes(8, 35)' app/src/main/java/com/suhas/iposentinel/ResearchLearningScheduler.kt
          grep -n 'class OffMarketResearchWorker' app/src/main/java/com/suhas/iposentinel/ResearchLearningScheduler.kt
          grep -n 'delayToMinutes(18, 45)' app/src/main/java/com/suhas/iposentinel/ResearchLearningScheduler.kt
          grep -n 'listing_momentum_consensus' app/src/main/java/com/suhas/iposentinel/AdaptiveStrategyEngine.kt
          grep -n 'vwap_reclaim_absorption' app/src/main/java/com/suhas/iposentinel/AdaptiveStrategyEngine.kt
          grep -n 'breakout_retest_continuation' app/src/main/java/com/suhas/iposentinel/AdaptiveStrategyEngine.kt
          grep -n 'compression_expansion' app/src/main/java/com/suhas/iposentinel/AdaptiveStrategyEngine.kt
          grep -n 'relative_strength_continuation' app/src/main/java/com/suhas/iposentinel/AdaptiveStrategyEngine.kt
          grep -n 'groww == "NSE-" + nse' app/src/main/java/com/suhas/iposentinel/SignalLearning.kt
          grep -n 'ACTIVE SHADOW' app/src/main/java/com/suhas/iposentinel/CallLedger.kt
          grep -n 'migrateLegacyResearchRows' app/src/main/java/com/suhas/iposentinel/CallLedger.kt
          grep -n 'liveExecutionReady = false' app/src/main/java/com/suhas/iposentinel/DirectGrowwClient.kt
          grep -n 'BIND_NOTIFICATION_LISTENER_SERVICE' app/src/main/AndroidManifest.xml
          grep -n 'RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml

          if grep -n -E 'BackendApi\(|fetchResearchPlan\(|fetchResearchDashboard\(|fetchStrategySummary\(|fetchOrderEvents\(' "${ACTIVE_FILES[@]}"; then
            echo "Active Android architecture calls the disabled legacy BackendApi path."
            exit 1
          fi

          if grep -n -E 'IPO_SENTINEL_API_URL|IPO_SENTINEL_DEVICE_KEY|X-IPO-Sentinel-Device-Key|Trading Service|trading-service endpoint|device key|backend URL' "${ACTIVE_FILES[@]}"; then
            echo "Legacy user-entered service configuration leaked into active Android UI/state."
            exit 1
          fi

          if grep -n -E 'http://' "${ACTIVE_FILES[@]}" app/src/main/java/com/suhas/iposentinel/DirectGrowwClient.kt app/src/main/java/com/suhas/iposentinel/DirectResearchClient.kt; then
            echo "Cleartext URL found in active Android networking."
            exit 1
          fi

          if grep -n -E '/v1/order/(create|modify|cancel)' "${ACTIVE_FILES[@]}"; then
            echo "Direct securities-order submission endpoints are prohibited in this build."
            exit 1
          fi

          if grep -n -E 'startForeground\(|fetchOrderEvents\(' app/src/main/java/com/suhas/iposentinel/SignalLearning.kt app/src/main/java/com/suhas/iposentinel/ResearchLearningScheduler.kt; then
            echo "Signal/replay engine must remain direct and local, not legacy foreground/backend polling."
            exit 1
          fi

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile Android
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Strategy unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare verified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/IPO-Sentinel-v1.4.4-LIVE-READINESS-debug.apk
          test -s release/IPO-Sentinel-v1.4.4-LIVE-READINESS-debug.apk
          sha256sum release/IPO-Sentinel-v1.4.4-LIVE-READINESS-debug.apk > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPO-Sentinel-v1.4.4-LIVE-READINESS
          path: |
            android/release/IPO-Sentinel-v1.4.4-LIVE-READINESS-debug.apk
            android/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
