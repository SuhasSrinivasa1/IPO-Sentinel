name: Temporary Ruff Autofix

on:
  push:
    branches:
      - release/v1.2.0
    paths:
      - ".github/workflows/ruff-autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8,<1"
      - name: Apply safe Ruff fixes
        working-directory: backend
        run: python -m ruff check app scripts tests --fix || true
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safe Ruff fixes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Apply safe Ruff autofixes"
          git push origin HEAD:release/v1.2.0
